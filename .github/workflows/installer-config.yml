name: installer-config

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  static-installer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install PyYAML jsonschema pytest
      - name: Fetch the pinned Calamares schemas
        run: |
          python - "$RUNNER_TEMP/calamares-lock.txt" <<'PY'
          import sys
          import yaml
          lock = yaml.safe_load(open("installer.lock.yaml", encoding="utf-8"))["calamares"]
          open(sys.argv[1], "w", encoding="utf-8").write(lock["archive"] + "\n" + lock["sha256"] + "\n")
          PY
          mapfile -t calamares_lock < "$RUNNER_TEMP/calamares-lock.txt"
          curl --fail --location --silent --show-error "${calamares_lock[0]}" -o "$RUNNER_TEMP/calamares.tar.gz"
          echo "${calamares_lock[1]}  $RUNNER_TEMP/calamares.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/calamares-source"
          tar -xzf "$RUNNER_TEMP/calamares.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/calamares-source"
      - name: Validate Calamares schema and safety contracts
        run: python scripts/check-installer.py --schema-root "$RUNNER_TEMP/calamares-source/src/modules"
      - name: Test pinned source-cache recovery
        run: python -m pytest tests/test_installer_source_cache.py -q
      - name: Confirm the chooser matches the pinned product resolver
        run: |
          python scripts/render-installer-catalogue.py --cache-dir "$RUNNER_TEMP/product-cache" --output "$RUNNER_TEMP/generated/packagechooser.conf"
          cmp image/calamares/modules/packagechooser.conf "$RUNNER_TEMP/generated/packagechooser.conf"
          cmp image/calamares/modules/compositions.json "$RUNNER_TEMP/generated/compositions.json"
      - name: Check build-script syntax
        run: bash -n scripts/build-iso.sh scripts/build-package-repository.sh image/archiso/airootfs/usr/local/bin/hornero-installer-start
