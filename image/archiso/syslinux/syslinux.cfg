# HorneroOS live ISO (BIOS) boot menu - Hornero Signal.
# Roles from hornero-signal-night (HorneroOS/config): ground #0C1016,
# ink #E6EBF1, inkMuted #A9B7C6, raised #24303D, signal #F2AC52.
# splash.png is rendered by HorneroOS/config scripts/render-boot-assets.sh
# (iso/splash.png) and committed here because archiso copies it from this
# directory; see docs/live-iso-boot-menu.md. Syslinux cannot draw an accent
# bar, so the selection is a raised block; the amber lives in the artwork.
DEFAULT hornero
PROMPT 0
TIMEOUT 50
UI vesamenu.c32

MENU TITLE
MENU BACKGROUND splash.png
MENU RESOLUTION 800 600
MENU CLEAR
MENU MARGIN 0
MENU WIDTH 48
MENU ROWS 4
MENU HSHIFT 6
MENU VSHIFT 9
MENU TIMEOUTROW 24
MENU TABMSGROW 22
MENU CMDLINEROW 22
MENU HELPMSGROW 26
MENU TABMSG
MENU AUTOBOOT Starting in # seconds

MENU COLOR screen   0       #ffE6EBF1 #00000000 none
MENU COLOR border   0       #00000000 #00000000 none
MENU COLOR title    0       #ffA9B7C6 #00000000 none
MENU COLOR unsel    0       #ffA9B7C6 #00000000 none
MENU COLOR sel      7       #ffE6EBF1 #ff24303D all
MENU COLOR hotkey   0       #ffA9B7C6 #00000000 none
MENU COLOR hotsel   7       #ffE6EBF1 #ff24303D all
MENU COLOR disabled 0       #ff8999AB #00000000 none
MENU COLOR scrollbar 0      #00000000 #00000000 none
MENU COLOR tabmsg   0       #ffA9B7C6 #00000000 none
MENU COLOR cmdmark  0       #ffF2AC52 #00000000 none
MENU COLOR cmdline  0       #ffE6EBF1 #00000000 none
MENU COLOR timeout_msg 0    #ffA9B7C6 #00000000 none
MENU COLOR timeout  0       #ffF2AC52 #00000000 none
MENU COLOR help     0       #ffA9B7C6 #00000000 none

LABEL hornero
  MENU LABEL HorneroOS installer (BIOS)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n %KERNEL_PARAMS%

LABEL hornero-safe
  MENU LABEL HorneroOS installer (BIOS, Safe Graphics)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nomodeset WLR_RENDERER=pixman %KERNEL_PARAMS%
