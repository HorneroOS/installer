<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- HorneroOS live ISO fontconfig defaults (installer#101):
       1. Expose Hornero Shell's bundled Hornero Glyphs icon font so
          fc-match 'Hornero Glyphs' resolves without falling back.
       2. Match HorneroOS/config desktop/fontconfig/fonts.conf system-wide
          so both hornero-live and root (Calamares) resolve IBM Plex
          with Noto CJK and emoji fallbacks. -->
  <dir>/etc/xdg/quickshell/hornero/assets/fonts</dir>
  <match target="font">
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="autohint">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
