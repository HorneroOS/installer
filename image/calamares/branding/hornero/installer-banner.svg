<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="HorneroOS installer banner">
  <!-- Brand art inlined from HorneroOS/config assets/brand/logo-dark.svg
       (canonical HorneroOS brand identity, config/docs/BRAND.md).
       Palette: night adobe #1D1410, sunset amber #F2B749, ember
       terracotta #E07856, cream #F6E9DB. -->
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241610"/>
      <stop offset="1" stop-color="#1D1410"/>
    </linearGradient>
    <linearGradient id="banner-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B749"/>
      <stop offset="0.55" stop-color="#E89A55"/>
      <stop offset="1" stop-color="#E07856"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" rx="28" fill="url(#banner-bg)"/>
  <g transform="translate(30 22) scale(0.6875)">
    <circle cx="128" cy="124" r="86" fill="url(#banner-sun)"/>
    <g fill="#F6E9DB">
      <path d="M100,168 L52,206 L70,212 L114,180 Z"/>
      <ellipse cx="124" cy="140" rx="34" ry="42" transform="rotate(-12 124 140)"/>
      <circle cx="140" cy="92" r="24"/>
      <path d="M160,85 C169,88 180,93 189,100 L160,105 Z"/>
      <rect x="111" y="176" width="7" height="22" rx="3.5"/>
      <rect x="129" y="174" width="7" height="23" rx="3.5"/>
    </g>
    <path d="M36,200 C90,188 166,188 220,200" fill="none" stroke="#F6E9DB" stroke-width="13" stroke-linecap="round"/>
    <circle cx="146" cy="88" r="5.5" fill="#B24827"/>
  </g>
  <text x="252" y="104" fill="#F6E9DB" font-family="Rubik, sans-serif" font-size="44" font-weight="800" letter-spacing="2">HORNERO<tspan fill="#E07856">OS</tspan></text>
  <rect x="256" y="122" width="120" height="8" rx="4" fill="#F2B749"/>
  <text x="254" y="162" fill="#D9C6B2" font-family="Rubik, sans-serif" font-size="19">Calamares · Provisional installer</text>
  <rect x="580" y="84" width="140" height="44" rx="22" fill="#E07856"/>
  <text x="650" y="112" text-anchor="middle" fill="#1D1410" font-family="Rubik, sans-serif" font-size="16" font-weight="800" letter-spacing="2">PREVIEW</text>
</svg>
