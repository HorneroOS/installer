<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Niri compositor support is experimental</title>
  <desc id="description">A HorneroOS installer information card. It is not a screenshot of a Niri desktop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212a"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88b6a1"/>
      <stop offset="1" stop-color="#d9b77c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" rx="34" fill="url(#background)"/>
  <circle cx="1034" cy="145" r="210" fill="#536d77" opacity=".12"/>
  <circle cx="1034" cy="145" r="144" fill="none" stroke="#88b6a1" stroke-opacity=".18" stroke-width="2"/>
  <rect x="92" y="92" width="70" height="8" rx="4" fill="url(#accent)"/>
  <text x="92" y="154" fill="#a8b4bb" font-family="sans-serif" font-size="23" letter-spacing="6">HORNEROOS DESKTOP</text>
  <text x="92" y="270" fill="#f3f5f5" font-family="sans-serif" font-size="92" font-weight="600">Niri</text>
  <rect x="92" y="316" width="250" height="50" rx="25" fill="#293931" stroke="#88b6a1" stroke-opacity=".6"/>
  <circle cx="121" cy="341" r="6" fill="#d9b77c"/>
  <text x="143" y="349" fill="#dbe8df" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="2">EXPERIMENTAL</text>
  <text x="92" y="445" fill="#c5cdd1" font-family="sans-serif" font-size="28">Hornero Shell with the Niri compositor.</text>
  <text x="92" y="490" fill="#c5cdd1" font-family="sans-serif" font-size="28">Core desktop support is still being validated.</text>
  <path d="M92 566H1188" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="92" y="626" fill="#92a0a7" font-family="sans-serif" font-size="20">This is an information card, not a desktop screenshot.</text>
  <text x="92" y="690" fill="#6f7f86" font-family="sans-serif" font-size="18" letter-spacing="3">WAYLAND-FIRST · HORNEROS.COM</text>
</svg>
