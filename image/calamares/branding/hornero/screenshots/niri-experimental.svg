<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Niri compositor support is experimental</title>
  <desc id="description">A HorneroOS installer information card on Hornero Signal. It is not a screenshot of a Niri desktop.</desc>
  <!-- Signal Night roles: ground #0C1016, sunken #10151C, ink #E6EBF1,
       inkMuted #A9B7C6, rule #2D3B4B, ruleStrong #8393A6,
       signalWell #3D2B12, onSignalWell #FFE0B0, signal #F2AC52. -->
  <rect width="1280" height="800" rx="5" fill="#0C1016"/>
  <rect x="0.5" y="0.5" width="1279" height="799" rx="5" fill="none" stroke="#2D3B4B"/>
  <text x="92" y="132" fill="#A9B7C6" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="2.4">01 · HORNEROOS DESKTOP</text>
  <path d="M92 158H1188" stroke="#2D3B4B"/>
  <text x="88" y="290" fill="#E6EBF1" font-family="IBM Plex Sans Condensed, IBM Plex Sans, sans-serif" font-size="112" font-weight="500">Niri</text>
  <rect x="92" y="326" width="236" height="46" rx="3" fill="#3D2B12" stroke="#F2AC52"/>
  <text x="210" y="357" text-anchor="middle" fill="#FFE0B0" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="600" letter-spacing="2.4">EXPERIMENTAL</text>
  <rect x="92" y="412" width="1096" height="124" rx="3" fill="#10151C" stroke="#2D3B4B"/>
  <text x="120" y="462" fill="#E6EBF1" font-family="IBM Plex Sans, sans-serif" font-size="28">Hornero Shell with the Niri compositor.</text>
  <text x="120" y="506" fill="#E6EBF1" font-family="IBM Plex Sans, sans-serif" font-size="28">Core desktop support is still being validated.</text>
  <text x="92" y="626" fill="#A9B7C6" font-family="IBM Plex Sans, sans-serif" font-size="20">This is an information card, not a desktop screenshot.</text>
  <text x="92" y="690" fill="#A9B7C6" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2.2">WAYLAND-FIRST · HORNEROOS.COM</text>
</svg>
