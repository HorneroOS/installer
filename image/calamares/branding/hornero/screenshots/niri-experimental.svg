<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Niri compositor support is experimental</title>
  <desc id="description">A HorneroOS installer information card. It is not a screenshot of a Niri desktop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241610"/>
      <stop offset="1" stop-color="#1D1410"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B749"/>
      <stop offset="1" stop-color="#E07856"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" rx="34" fill="url(#background)"/>
  <circle cx="1034" cy="145" r="210" fill="#E07856" opacity=".12"/>
  <circle cx="1034" cy="145" r="144" fill="none" stroke="#F2B749" stroke-opacity=".18" stroke-width="2"/>
  <rect x="92" y="92" width="70" height="8" rx="4" fill="url(#accent)"/>
  <text x="92" y="154" fill="#D9C6B2" font-family="sans-serif" font-size="23" letter-spacing="6">HORNEROOS DESKTOP</text>
  <text x="92" y="270" fill="#F6E9DB" font-family="sans-serif" font-size="92" font-weight="600">Niri</text>
  <rect x="92" y="316" width="250" height="50" rx="25" fill="#3A2417" stroke="#F2B749" stroke-opacity=".6"/>
  <circle cx="121" cy="341" r="6" fill="#E07856"/>
  <text x="143" y="349" fill="#F6E9DB" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="2">EXPERIMENTAL</text>
  <text x="92" y="445" fill="#EDE0CF" font-family="sans-serif" font-size="28">Hornero Shell with the Niri compositor.</text>
  <text x="92" y="490" fill="#EDE0CF" font-family="sans-serif" font-size="28">Core desktop support is still being validated.</text>
  <path d="M92 566H1188" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="92" y="626" fill="#B8A48E" font-family="sans-serif" font-size="20">This is an information card, not a desktop screenshot.</text>
  <text x="92" y="690" fill="#8A7460" font-family="sans-serif" font-size="18" letter-spacing="3">WAYLAND-FIRST · HORNEROS.COM</text>
</svg>
