<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Niri compositor support is experimental</title>
  <desc id="description">A HorneroOS installer information card on Hornero Signal. It is not a screenshot of a Niri desktop.</desc>
  <!-- Signal Night roles: ground #0C0F13, sunken #101419, ink #ECE6DA,
       inkMuted #A8ABAD, rule #2C333C, ruleStrong #707A85,
       signalWell #3A2A12, onSignalWell #FFD9A3, signal #F2A33A. -->
  <rect width="1280" height="800" rx="5" fill="#0C0F13"/>
  <rect x="0.5" y="0.5" width="1279" height="799" rx="5" fill="none" stroke="#2C333C"/>
  <text x="92" y="132" fill="#A8ABAD" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="2.4">01 · HORNEROOS DESKTOP</text>
  <path d="M92 158H1188" stroke="#2C333C"/>
  <text x="88" y="290" fill="#ECE6DA" font-family="IBM Plex Sans Condensed, IBM Plex Sans, sans-serif" font-size="112" font-weight="500">Niri</text>
  <rect x="92" y="326" width="236" height="46" rx="3" fill="#3A2A12" stroke="#F2A33A"/>
  <text x="210" y="357" text-anchor="middle" fill="#FFD9A3" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="600" letter-spacing="2.4">EXPERIMENTAL</text>
  <rect x="92" y="412" width="1096" height="124" rx="3" fill="#101419" stroke="#2C333C"/>
  <text x="120" y="462" fill="#ECE6DA" font-family="IBM Plex Sans, sans-serif" font-size="28">Hornero Shell with the Niri compositor.</text>
  <text x="120" y="506" fill="#ECE6DA" font-family="IBM Plex Sans, sans-serif" font-size="28">Core desktop support is still being validated.</text>
  <text x="92" y="626" fill="#A8ABAD" font-family="IBM Plex Sans, sans-serif" font-size="20">This is an information card, not a desktop screenshot.</text>
  <text x="92" y="690" fill="#A8ABAD" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2.2">WAYLAND-FIRST · HORNEROOS.COM</text>
</svg>
