---
modules-search: [ local ]
instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - packages
      - shellprocess@cleanup
      - users
      - services-systemd
      - initcpiocfg
      - initcpio
      - initramfs
      - bootloader
      - umount
  - show:
      - finished
branding: hornero
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
