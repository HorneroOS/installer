---
modules-search: [ local ]
instances:
  - id: preflight
    module: shellprocess
    config: shellprocess-preflight.conf
  - id: resolver
    module: shellprocess
    config: shellprocess-resolver.conf
  - id: resolver-cleanup
    module: shellprocess
    config: shellprocess-resolver-cleanup.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
  - id: user-defaults
    module: shellprocess
    config: shellprocess-user-defaults.conf
  - id: greeter-session
    module: shellprocess
    config: shellprocess-greeter-session.conf
  - id: os-identity
    module: shellprocess
    config: shellprocess-os-identity.conf
  - id: recovery
    module: shellprocess
    config: shellprocess-recovery.conf
  - id: verify
    module: shellprocess
    config: shellprocess-verify.conf
  - id: initcpio-encrypt
    module: shellprocess
    config: shellprocess-initcpio-encrypt.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser
      - summary
  - exec:
      - shellprocess@preflight
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - shellprocess@resolver
      - packages
      - shellprocess@resolver-cleanup
      - shellprocess@cleanup
      - users
      - shellprocess@user-defaults
      - shellprocess@greeter-session
      - shellprocess@os-identity
      - shellprocess@recovery
      - services-systemd
      - initcpiocfg
      - shellprocess@initcpio-encrypt
      - initcpio
      - grubcfg
      - bootloader
      - shellprocess@verify
      - umount
  - show:
      - finished
branding: hornero
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
