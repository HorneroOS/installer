---
# HorneroUsers page config (installer#111). VM-gated: this module is built
# and installed by packaging/calamares/PKGBUILD but is NOT in the show
# sequence in settings.conf until the VM rows in docs/calamares-provisional.md
# pass (page loads, 0600 selection on tmpfs, users/root created, untouched
# default identical to preview32). Groups mirror extra-users-allowlist.yaml;
# wheel is absent on purpose (per-user admin flag only).
selectionPath: /run/hornero-installer/extra-users.json
minPasswordLength: 12
groups:
  - users
  - audio
  - video
  - input
  - storage
  - network
  - lp
  - scanner
