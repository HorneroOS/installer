---
# HorneroSystem page config (installer#113). VM-gated: this module is
# built and installed by packaging/calamares/PKGBUILD but is NOT in
# the show sequence in settings.conf until the VM rows pass (page
# loads before Partition, systemd-boot UEFI plain+LUKS boots, GRUB
# BIOS/UEFI unchanged, swap partition without LUKS, untouched default
# identical to preview32). When activated it must sit before
# `partition` so its firmware gate blocks Next before any disk write.
# Kernels mirror system-allowlist.yaml; themes are absent on purpose
# (record-only single theme, no real consumer yet).
selectionPath: /run/hornero-installer/system-selection.json
kernels:
  - linux
  - linux-lts
  - linux-zen
  - linux-hardened
