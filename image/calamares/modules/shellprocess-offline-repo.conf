---
# Runs on the live system (no chroot) after system-plan and before the
# packages job: no-op without the launcher's offline marker; with it,
# verifies the on-media repository and points the target pacman.conf
# at file:// repositories only. The pre-partition preflight already
# rejected a missing/incomplete repository on the same marker.
dontChroot: true
timeout: 300
verbose: true
script:
  - /usr/bin/python3 /usr/lib/hornero-installer/offline-repo.py --root ${ROOT}
