---
backend: pacman
skip_if_no_internet: false
update_db: true
ignore_update_db_error: false
update_system: false
pacman:
  # Repository downloads can outlast a brief DNS interruption. Calamares
  # reruns the idempotent pacman operation and keeps successfully cached files.
  num_retries: 8
  disable_download_timeout: true
  needed_only: true
operations: []
