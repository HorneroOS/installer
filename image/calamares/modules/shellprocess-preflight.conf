---
# Runs on the live system (no chroot) as the first exec step, before
# partition: aborts the install while no disk has been touched when the
# squashfs payload is not readable.
dontChroot: true
emergency: true
timeout: 15
verbose: true
script:
  - /usr/bin/python3 /usr/local/lib/hornero-installer/preflight-payload.py
