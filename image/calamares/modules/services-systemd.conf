---
units:
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: sddm.service
    action: enable
    mandatory: true
  - name: systemd-timesyncd.service
    action: enable
  - name: bluetooth.service
    action: enable
    mandatory: false
  # Snapshots capability units: present only when the opt-in
  # capability installed snapper/grub-btrfs, so never mandatory.
  - name: snapper-timeline.timer
    action: enable
    mandatory: false
  - name: snapper-cleanup.timer
    action: enable
    mandatory: false
  - name: grub-btrfsd.service
    action: enable
    mandatory: false
