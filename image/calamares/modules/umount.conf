---
# Setting emergency to true makes Calamares still run this module when a
# prior module fails (e.g. unpackfs or initcpio/initramfs generation), not
# only on the success path. Without it, a failed install leaves the target
# mounted under /tmp/calamares-root-* until the installer process exits and
# the post-exit runner cleanup runs; a retry in the same session then sees
# a stale mounted target. User cancellation is already covered by the
# post-exit runner (Calamares does not run emergency modules on cancel).
emergency: true
