---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - wheel
user:
  home_permissions: "750"
  # New accounts start on Zsh (the factory shell baseline). Existing
  # accounts are never modified by the installer.
  shell: /usr/bin/zsh
autologinGroup: ""
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
# Root stays locked here on purpose: stock Calamares 3.4.3 blocks Next on
# an empty root password under the minLength policy below, so a separate
# optional root password is applied by shellprocess@extra-users instead
# (empty selection = root remains locked, as today). Never reuse the
# primary user's password for root.
doReusePassword: false
displayAutologin: false
doAutologin: false
passwordRequirements:
  minLength: 12
  maxLength: 1024
  libpwquality:
    - minlen=12
    - maxrepeat=4
    - dictcheck=1
