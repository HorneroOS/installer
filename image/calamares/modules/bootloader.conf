---
# The HorneroSystem page (VM-gated, installer#113) stores its validated
# bootloader choice in GlobalStorage under this key; the stock
# bootloader job reads it instead of efiBootLoader when present. With
# no system selection the variable is absent and GRUB stays the
# preview32 default. systemd-boot is gated in the page (UEFI only,
# ESP >= 1024 MiB) and again in apply-system-plan.py.
efiBootLoaderVar: hornero_bootloader
efiBootLoader: grub
kernelSearchPath: /usr/lib/modules
kernelPattern: ^vmlinuz.*
loaderEntries:
  - timeout 5
  - console-mode keep
kernelParams: [quiet]
grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr
efiBootloaderId: HorneroOS
installEFIFallback: true
installHybridGRUB: false
