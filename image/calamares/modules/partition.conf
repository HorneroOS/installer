---
initialPartitioningChoice: none
createHybridBootloaderLayout: true
efi:
  mountPoint: /boot
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: EFI
defaultFileSystemType: btrfs
# Swap partition stays un-offered: with LUKS, Calamares generates an
# `openswap` mkinitcpio hook that neither stock mkinitcpio nor this
# Calamares build installs into the target, so mkinitcpio fails
# ("ERROR: Hook 'openswap' cannot be found") after partitioning.
# `file` is safe: mount.conf already maps it to the /@swap Btrfs
# subvolume and fstab creates a fixed 512 MiB swapfile there (no
# hibernation; grubcfg emits no resume offset for swapfiles).
userSwapChoices: [ none, file ]
initialSwapChoice: none
lvm:
  enable: true
preCheckEncryption: true
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
