---
initialPartitioningChoice: none
createHybridBootloaderLayout: true
efi:
  mountPoint: /boot
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: EFI
defaultFileSystemType: btrfs
# Only `none` until encrypted swap is proven: with LUKS, Calamares
# generates an `openswap` mkinitcpio hook that neither stock mkinitcpio
# nor this Calamares build installs into the target, so mkinitcpio
# fails ("ERROR: Hook 'openswap' cannot be found") after partitioning.
# Swap can be added post-install as a Btrfs swapfile (see docs).
userSwapChoices: [ none ]
initialSwapChoice: none
lvm:
  enable: true
preCheckEncryption: true
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
