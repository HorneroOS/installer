---
initialPartitioningChoice: none
createHybridBootloaderLayout: true
efi:
  mountPoint: /boot
  recommendedSize: 512MiB
  minimumSize: 256MiB
  label: EFI
defaultFileSystemType: btrfs
# Swap partition (`small`) is offered only for unencrypted installs:
# with LUKS, Calamares generates an `openswap` mkinitcpio hook that
# neither stock mkinitcpio nor this Calamares build installs into the
# target, so mkinitcpio fails ("ERROR: Hook 'openswap' cannot be
# found") after partitioning. apply-system-plan.py aborts a
# swap-partition selection when the mounted target carries a crypttab
# (LUKS chosen here), before any package transaction. Hibernation
# (`suspend`) is not offered at all: the openswap hook is not pinned
# in the Hornero catalogue. `file` is safe: mount.conf maps it to the
# /@swap Btrfs subvolume and fstab creates a fixed 512 MiB swapfile
# there (no hibernation; grubcfg emits no resume offset for swapfiles).
userSwapChoices: [ none, file, small ]
initialSwapChoice: none
lvm:
  enable: true
preCheckEncryption: true
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
